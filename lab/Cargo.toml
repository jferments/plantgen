# PlantLab: a desktop lab for growing and reviewing PlantGen's plants.
# Its own workspace, so the generator's workspace keeps its five
# dependencies and never builds Bevy.
[workspace]
resolver = "3"
members = ["scene", "app"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
plantgen = { path = "../crates/plantgen" }
plantlab-scene = { path = "scene" }
bevy = { version = "=0.19.1", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "3d_bevy_render",
    "png",
    # The window (V3); headless runs leave it out.
    "bevy_winit",
    "bevy_window",
    "x11",
    # Captions and titles on review sheets.
    "bevy_ui",
    "bevy_ui_render",
    "bevy_text",
    "default_font",
    # Soft shadows for the photo look.
    "experimental_pbr_pcss",
    # The window's measuring grid and height ruler.
    "bevy_gizmos_render",
] }

# The versions Project After pins for Bevy 0.19 (PlantLab pins its own,
# but starts from the same ones).
bevy_egui = { version = "=0.42.0", default-features = false, features = [
    "render",
    "default_fonts",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
# Names such as PlantGen and PlantLab are words here, not code.
doc_markdown = { level = "allow", priority = 1 }
# Bevy systems take their resources by value.
needless_pass_by_value = { level = "allow", priority = 1 }

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 3
