[package]
name = "plantlab"
description = "PlantLab: grow PlantGen's plants under chosen conditions and render them."
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
plantgen.workspace = true
plantlab-scene.workspace = true
bevy.workspace = true
# The version Bevy uses, for choosing the GPU by index (`src/gpu.rs`).
wgpu = { version = "=29.0.4", default-features = false }
# The versions plantgen pins: batch files and resume keys.
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[features]
# Bevy's experimental hardware ray-traced lighting, for the Solari spike
# (`plantlab solari`): RTX-class GPUs only, never lavapipe.
solari = ["bevy/bevy_solari"]

[lints]
workspace = true

[dev-dependencies]
# Reads back the pictures in the GPU test; the version plantgen pins.
png = "=0.18.1"
