  views: [V8]
  maps_to: {proposed: fruit_shape, related_trait: [fruit_size_m, fruit_width_m]}
  states:
    globose: round
    ovoid: egg-shaped, wider at the base
    obovoid: egg-shaped, wider at the tip
    obconic: an upside-down cone, flat top
    clavate: club-shaped, narrow base, swollen tip
    ellipsoid: oval, both ends alike
    cylindric: long, parallel sides
    flattened: pod, samara or other flat fruit
  reliability: good

- id: fruit.colour
  scale: fruit
  question: Colour of the fruit as seen. Say in the note whether it looks ripe (full size, coloured, soft or splitting) or unripe.
  type: colour
  views: [V8, V4]
  maps_to: {trait: fruit_colour_ripe}
  reliability: fair
  notes: Ripe and unripe answers are aggregated separately, by the note.

- id: fruit.posture
  scale: fruit
  question: Which way do the fruits hang?
  type: state
  views: [V8, V4]
  maps_to: {trait: fruit_posture}
  states:
    erect: pointing up
    spreading: held out sideways
    deflexed: bent down
    pendent: hanging
  reliability: good

- id: fruit.arrangement
  scale: fruit
  question: How are the fruits grouped?
  type: state
  views: [V8, V4]
  maps_to: {proposed: fruit_arrangement}
  states:
    single: one at a time
    cluster: several together
    spike: many small fruits along a hanging or upright axis
    chain: fruits growing from fruits in chains
  reliability: good

- id: fruit.surface
  scale: fruit
  question: Surface of the fruit.
  type: state
  views: [V8]
  maps_to: {proposed: fruit_surface}
  states:
    smooth: smooth or glossy
    scaly: covered in scales
    spiny: with spines or spine clusters
    hairy: hairy or woolly
    winged: with wings
  reliability: good

- id: fruit.perianth_remnant
  scale: fruit
  question: What stays on top of a ripe or ripening fruit, where the flower was?
  type: state
  views: [V8, V4]
  maps_to: {proposed: persistent_perianth}
  states:
    none: a bare top, at most a small scar or the stub of a style
    calyx: a crown of persistent sepals (calyx lobes), as on a rose hip or an apple
    perianth: the whole dried flower, a tuft of withered tepals or petals, straw-coloured to brown (barrel cacti)
  reliability: good
  notes: Answer on fruit at least half grown; a flower just over still holds its perianth whatever the plant. A remnant knocked off by animals or weather shows as a torn scar; say so in the note.

- id: fruit.size_over_leaf
  scale: fruit
  question: Fruit length divided by a nearby leaf blade's length.
  type: ratio
  views: [V4, V8]
  maps_to: {trait: fruit_size_m}
  reliability: fair

- id: cone.posture
  scale: fruit
  question: Conifers. Which way do the seed cones point?
  type: state
  views: [V4, V8]
  maps_to: {trait: cone_posture}
