# --------------------------------------------------------- 7. inflorescence
- id: infl.type
  scale: inflorescence
  question: How are the flowers grouped?
  type: state
  views: [V7, V1, V4]
  maps_to: {trait: inflorescence}
  states:
    solitary: one flower on its own stalk
    raceme: stalked flowers along an unbranched axis
    spike: stalkless flowers along an unbranched axis
    catkin: a dense, often hanging spike of tiny flowers
    corymb: stalks of different lengths bringing flowers to one flat top
    umbel: stalks all from one point, like an umbrella
    compound_umbel: umbels on the rays of an umbel
    panicle: a branched cluster
    cyme: each axis ends in a flower, side branches flower later
    scorpioid: a coiled one-sided cyme uncurling as it flowers
    head: many stalkless flowers packed on one base (daisy, clover)
    spadix: a fleshy spike, usually with a hood (spathe)
  reliability: fair

- id: infl.posture
  scale: inflorescence
  question: Which way does the whole cluster point?
  type: state
  views: [V7, V1]
  maps_to: {trait: inflorescence_posture}
  states:
    erect: upright
    nodding: bent over at the top
    pendent: hanging
  reliability: good

- id: infl.position
  scale: inflorescence
  question: Where on the shoots do the flowers or clusters sit?
  type: state
  views: [V4, V1]
  maps_to: {trait: flowering_position}
  states:
    terminal: at the shoot tips
    lateral: along the shoots, in the leaf axils or on old wood
    both: both
  reliability: good

- id: infl.density
  scale: inflorescence
  question: How closely packed are the flowers along the cluster?
  type: ordinal
  views: [V7]
  maps_to: {proposed: inflorescence_density}
  states:
    loose: clear stalk between neighbouring flowers
    medium: flowers touch here and there
    dense: flowers packed, hiding the axis
  reliability: good
  notes: The lupine raceme drawn sparse where the flora says dense is the case that raised this.

- id: infl.open_share
  scale: inflorescence
  question: Share of the cluster's flowers that are open (not bud, not fruit).
  type: share
  views: [V7]
  maps_to: {proposed: opening_order}
  reliability: fair
  notes: Depends on the date; the comparison uses it to match the render day.

- id: infl.length_over_height
  scale: inflorescence
  question: Length of one flower cluster divided by the plant's height (herbs) or by a leaf's length (trees and shrubs).
  type: ratio
  views: [V1, V4, V7]
  maps_to: {trait: inflorescence_length_m}
  reliability: fair

