# ---------------------------------------------------------------- 9. surface
- id: surface.bark_texture
  scale: surface
  question: Bark texture on the lower trunk.
  type: state
  views: [V8, V1]
  maps_to: {trait: bark_texture}
  states:
    smooth: smooth, unbroken
    furrowed: deep vertical furrows with ridges between
    plated: broken into large flat plates
    scaly: small flakes or scales
    peeling: peeling in strips or sheets
    fibrous: stringy, shredding fibres
  reliability: good

- id: surface.bark_colour
  scale: surface
  question: Colour of the bark on the lower trunk, lit.
  type: colour
  views: [V8, V1]
  maps_to: {trait: bark_colour}
  reliability: fair
  notes: Note if furrows and ridges differ in colour (ponderosa has orange plates and dark furrows).

- id: surface.stem_colour
  scale: surface
  question: Colour of a green stem's skin (cacti, herbs, succulents), lit.
  type: colour
  views: [V8, V1]
  maps_to: {trait: stem_colour}
  reliability: fair

- id: surface.ribs
  scale: surface
  question: Cacti and ribbed stems. Number of ribs around the stem.
  type: count
  views: [V1, V3, V8]
  maps_to: {trait: ribs}
  reliability: fair up to 15; bins beyond (from above is best)
  notes: "Count ribs from above where the image shows the apex; from the side, count from edge to edge and double (ground rule 6), noting it."

- id: surface.tubercle_relief
  scale: surface
  question: Cacti. How strongly do bumps (tubercles) stand out under the spine clusters?
  type: ordinal
  views: [V8]
  maps_to: {trait: tubercle_relief, related_trait: tubercles, extra_states: [absent]}
  states:
    absent: smooth ribs, no bumps (tubercles false)
    barely: ribs with only a slight swelling under each spine cluster
    low: low rounded bumps
    distinct: clear bumps, ribs still visible
    prominent: large bumps; ribs broken into separate knobs or absent
  reliability: good

- id: surface.areole_spacing
  scale: surface
  question: Cacti. Distance between neighbouring spine clusters along a rib, divided by the stem's diameter.
  type: ratio
  views: [V8]
  maps_to: {trait: areole_spacing_m}
  reliability: fair

- id: surface.spine_cover
  scale: surface
  question: Cacti. Share of the stem's skin hidden by spines, on the middle of the stem, at whatever distance the image gives.
  type: share
  views: [V8, V1]
  maps_to: {proposed: spine_cover}
  reliability: fair

- id: surface.spine_colour
  scale: surface
  question: Cacti. Colour of the spines; note young (top) and old (base) separately.
  type: colour
  views: [V8]
  maps_to: {trait: spine_colour}
  reliability: fair

- id: surface.spine_form
  scale: surface
  question: Cacti. Shape of the longest central spine.
  type: state
  views: [V8]
  maps_to: {trait: central_spine_form}
  states:
    straight: straight
    curved: gently curved
    hooked: ending in a sharp hook
    flattened: flat and ribbon-like
    twisted: twisted
  reliability: fair (close-ups only)

- id: surface.radial_spines
  scale: surface
  question: Cacti. Number of radial spines on one areole, the spines round its edge spreading flat or nearly so.
  type: count
  views: [V8]
  maps_to: {trait: radial_spines}
  reliability: fair up to 15 on areole close-ups; bins beyond
  notes: "Count two or three grown areoles from the middle of the stem and give the commonest number (02-observe.md). Count bristle-like radials too. Where radials and centrals cannot be told apart, count them all here and say so in the note."

- id: surface.central_spines
  scale: surface
  question: Cacti. Number of central spines on one areole, the spines standing out from its middle, usually stouter than the radials.
  type: count
  views: [V8]
  maps_to: {trait: central_spines}
  reliability: fair (areole close-ups only)
  notes: "0 where every spine spreads flat round the edge. Count on grown areoles, not near the apex where spines are still growing."

- id: surface.central_arrangement
  scale: surface
  question: Cacti. How are the central spines of one grown areole set?
  type: state
  views: [V8]
  maps_to: {proposed: central_spine_arrangement, related_trait: [central_spines, central_spine_form]}
  states:
    cross: four centrals set as a cross, up, down and to either side (the lower one often the stoutest)
    one_main: one central clearly stouter or longer than the rest (often hooked or flattened), others thin or absent
    irregular: two or more centrals of similar size with no regular pattern
    none: no spine stands out from the areole's middle
  reliability: fair (areole close-ups, seen face-on)
  notes: Fishhook barrel cactus has four centrals in a cross with the lowest one stout and hooked. The hook itself is surface.spine_form.

- id: surface.areole_size
  scale: surface
  question: Cacti. Length of a grown areole (the felted pad the spines grow from) along the rib, divided by the distance from its centre to the next areole's centre on the same rib.
  type: ratio
  views: [V8]
  maps_to: {proposed: areole_length_m, related_trait: areole_spacing_m}
  reliability: fair (areole close-ups, rib seen face-on)
  notes: "1.0 where neighbouring areoles touch along the rib. Measure the pad, not the spines or wool round it; where wool hides the pad, measure the wool's base and say so. Barrel cacti have large areoles, often more than half the spacing; small round dots are under 0.2."

- id: surface.areole_wool
  scale: surface
  question: Cacti. How much wool or felt does a grown areole carry?
  type: ordinal
  views: [V8, V3]
  maps_to: {proposed: areole_wool, related_trait: areole_wool_colour}
  states:
    none: bare pad, no wool or felt
    felt: a thin, short felt that shows the pad's outline
    woolly: a cushion of wool hiding the pad, standing out from the skin
    tufted: long wool or hairs spilling beyond the areole, as a tuft
  reliability: fair (areole close-ups; old areoles lose their wool, so answer on young grown ones and say in the note if the old are bare)
  notes: The wool at the stem's top is surface.apex_wool.

- id: surface.areole_wool_colour
  scale: surface
  question: Cacti. Colour of a grown areole's felt or wool, lit.
  type: colour
  views: [V8]
  maps_to: {trait: areole_wool_colour}
  reliability: fair
  notes: not applicable where the areoles carry no wool or felt (surface.areole_wool none). Old wool greys; note young and old separately.

- id: surface.gland_spines
  scale: surface
  question: Cacti. Are there reduced, stubby, gland-like spines in the upper part of the areole (above the main spines, toward the apex), unlike the true spines?
  type: state
  views: [V8]
  maps_to: {proposed: gland_spines}
  states:
    "yes": short, thick, blunt or bulbous spines, often yellow or red, sometimes with drops of nectar, dark residue or ants on them
    "no": every spine in the areole is a true spine, tapering to a point
  reliability: poor by eye; fair on sharp areole close-ups near the apex
  notes: "Barrel cacti (Ferocactus) have them on young areoles near the top; they wither on older ones, so answer on areoles near the apex."

- id: surface.apex_wool
  scale: surface
  question: Cacti. What covers the growing point at the top of the stem?
  type: ordinal
  views: [V3, V8]
  maps_to: {proposed: apex_wool}
  states:
    bare: skin shows at the apex, at most a small dot of felt
    felt: a small felted cap of wool at the very top, the young spines round it standing clear
    thatch: a thick mat of wool and young spines covering the apex and hiding the skin, often coloured
  reliability: fair (from above or a close-up of the top only)
  notes: Fishhook barrel cactus's apex is bare or a small grey dot; California barrel cactus's is hidden under a thick tan thatch of spines. Seen from the side, the top is cannot tell.

- id: surface.rib_course
  scale: surface
  question: Cacti and ribbed stems. How do the ribs run up the stem?
  type: state
  views: [V1, V3, V8]
  maps_to: {proposed: rib_course, related_trait: ribs}
  states:
    straight: straight up the stem, parallel to its axis
    spiralled: winding gradually round the stem as a spiral
    sinuous: wavy, bending from side to side between areoles
  reliability: good (side views of the whole stem)
  notes: Old barrel cacti often wind gradually; young ones are straighter.

- id: surface.rib_seam
  scale: surface
  question: Cacti and ribbed stems. Where the stem carries more ribs higher up than at its foot (or fewer), how are the ribs added or lost?
  type: state
  views: [V1, V8]
  maps_to: {related_trait: ribs}
  states:
    none: the same ribs run unbroken from foot to top
    forks: one rib at a time splits into two (a Y here and there), at different heights
    seam: many ribs end or begin together along one level, a line across the stem
  reliability: good (side views)
  notes: "No plant grows a seam; a render showing one is a drawing fault (D6). The PlantGen renders of Ferocactus wislizeni and F. cylindraceus at 0997ade showed one at mid-height."

# ---------------------------------------------------------------- 10. season
- id: season.stage
  scale: season
  question: What stage is the plant at?
  type: state
  views: [V1, V4, V6, V7, V8]
  maps_to: {trait: [flowering_months, fruiting_months]}
  states:
    vegetative: no flowers or fruit
    bud: flower buds, none open
    flowering: flowers open
    fruiting: fruit present, no flowers
    mixed: flowers and fruit together
  reliability: good
  notes: With the photo's date and hemisphere, this sets the render day for matching.

- id: season.leaf_state
  scale: season
  question: State of the foliage.
  type: state
  views: [V1, V4]
  maps_to: {trait: [leaf_out_months, leaf_fall_months, leaf_colour_autumn]}
  states:
    leafless: no leaves
    flushing: new leaves expanding
    full: full foliage
    none: no leaves by nature (most cacti); not a season
    autumn_colour: leaves turning colour
  reliability: good
  notes: "A plant with no leaves by nature (most cacti, leafless stems) is `none`, not `leafless`."
