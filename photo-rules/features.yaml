  type: count
  views: [V6]
  maps_to: {trait: perianth_parts}
  reliability: good up to 15; bins beyond

- id: flower.corolla_shape
  scale: flower
  question: Side view of one flower. Its shape.
  type: state
  views: [V7]
  maps_to: {trait: corolla_shape}
  states:
    rotate: flat, parts spread in one plane like a wheel
    cupped: a shallow bowl
    campanulate: a bell, as deep as wide
    funnelform: a narrow tube widening gradually to a flared mouth
    tubular: a long narrow tube, barely widening
    salverform: a slender tube ending abruptly in a flat face
    urceolate: an urn, swollen and narrowed at the mouth
  reliability: good

- id: flower.posture
  scale: flower
  question: Which way does an open flower face?
  type: state
  views: [V7, V1]
  maps_to: {proposed: flower_posture, related_trait: inflorescence_posture}
  states:
    upward: facing the sky
    outward: facing sideways
    nodding: facing down from a bent stalk
  reliability: good

- id: flower.part_shape
  scale: flower
  question: Shape of one petal, tepal or ray.
  type: state
  views: [V6]
  face_on: true
  maps_to: {trait: petal_shape}
  states:
    linear: long and narrow, parallel sides
    lanceolate: narrow, widest below the middle
    elliptic: widest at the middle
    oblong: parallel sides, rounded ends
    ovate: widest below the middle
    obovate: widest above the middle
    spatulate: spoon-shaped
    orbicular: round
  reliability: good

- id: flower.part_apex
  scale: flower
  question: Tip of one petal, tepal or ray.
  type: state
  views: [V6]
  face_on: true
  maps_to: {trait: petal_apex, related_trait: ray_apex, extra_states: [toothed]}
  states:
    acuminate: long tapering point
    acute: pointed
    obtuse: blunt
    rounded: evenly rounded
    truncate: squared off
    emarginate: notched
    bilobed: split into two lobes
    toothed: squared off with two or three small teeth
  reliability: good
  notes: For daisy rays this answers ray_apex (acute, rounded, truncate, toothed).

- id: flower.part_gaps
  scale: flower
  question: Do neighbouring petals or rays overlap, touch, or stand apart?
  type: state
  views: [V6]
  maps_to: {proposed: perianth_overlap}
  states:
    overlap: edges overlap
    touch: edges just meet
    gaps: narrow gaps between them
    spaced: wide gaps; parts stand well apart
  reliability: good

- id: flower.ray_sides
  scale: flower
  question: Daisy-type heads. Do the rays have parallel sides or taper?
  type: state
  views: [V6]
  maps_to: {proposed: ray_taper}
  states:
    parallel: strap-like, parallel sides
    tapering: narrowing toward the tip
  reliability: good

- id: flower.disc_shape
  scale: flower
  question: Daisy-type heads, side or oblique view. Shape of the central disc.
  type: state
  views: [V7, V6]
  maps_to: {trait: receptacle_shape}
  states:
    flat: flat
    convex: a low dome
    hemispheric: a half-ball
    conic: a cone
  reliability: good

- id: flower.anther_colour
  scale: flower
  question: Colour of the anthers (pollen sacs), if visible.
  type: colour
  views: [V6]
  maps_to: {proposed: anther_colour}
  reliability: fair

- id: flower.size_over_leaf
  scale: flower
  question: Diameter of one open flower (or head) divided by the length of a nearby leaf blade.
  type: ratio
  views: [V4, V6]
  maps_to: {trait: flower_size_m}
  reliability: fair
  notes: Only when both are in the same plane at the same distance.

- id: flower.carpels
  scale: flower
  question: Number of pistils or carpels in the middle of one flower (each with its own style or stigma tip), counted on the gynoecium.
  type: count
  views: [V6]
  maps_to: {trait: carpels}
  reliability: fair up to 15 on close-ups; points or bins beyond
  notes: "Magnolias and tulip tree carry many free carpels spiralled on a cone-like column: count those you can see across the column, double them (ground rule 6), and answer a bin over 15. Joined carpels (one ovary with several styles or stigma lobes) count by their styles or lobes; say so in the note. cannot tell where stamens or tepals hide the centre."

- id: flower.inner_over_outer
  scale: flower
  question: Length of an inner petal or tepal divided by the length of an outer one, on the same flower (calyx and corolla, or two whorls of petals or tepals).
  type: ratio
  views: [V6, V7]
  face_on: true
  maps_to: {proposed: inner_perianth_length_m, related_trait: [petal_length_m, sepal_length_m, perianth]}
  reliability: fair (open flowers seen from the side or obliquely, both whorls showing)
  notes: "Only where both parts lie roughly parallel to the image plane; a part seen end-on or curling toward the camera is cannot tell. 1.0 where the whorls are alike in size. Pawpaw's inner petals are a third to half as long as its outer ones (0.35-0.5). not applicable where the flower has one whorl, or where sepals are tiny or fall at opening (say so). Measure each part from its base to its tip, along its curve if curved."

- id: flower.part_curve
  scale: flower
  question: Side view of one open flower. How do the outer petals or tepals bend toward their tips?
  type: state
  views: [V7, V6]
  maps_to: {proposed: perianth_curvature, related_trait: corolla_shape}
  states:
    incurved: tips curve inward over the flower's middle, making a closed cup or globe
    erect: stand up straight or nearly, a cup or tulip shape
    spreading: held out flat or nearly so
    excurved: curve outward toward the tip, the tip turned out and back
    reflexed: bent sharply back toward the stalk
  reliability: good (side views)
  notes: "Pawpaw's outer petals are excurved and its inner ones stand up; tulip tree's tepals are erect in a cup. Where inner and outer differ, answer for the outer and give the inner in the note."

- id: flower.hair_ring
  scale: flower
  question: Is there a ring of hairs (or wool) between the petals or tepals and the stamens, inside the flower's throat?
  type: state
  views: [V6]
  maps_to: {proposed: floral_hair_ring}
  states:
    "yes": a ring or fringe of hairs or wool round the base of the stamens, inside the perianth
    "no": the stamens rise straight from the perianth's base with no hairs between
  reliability: fair (sharp face-on close-ups into an open flower only)
  notes: Fishhook barrel cactus's flowers have it. cannot tell where the throat is in shadow or closed.

- id: flower.tube_scales
  scale: flower
  question: Outside of a bud, or of an open flower's tube and pericarpel (the part below the petals, which becomes the fruit). What covers it?
  type: state
  views: [V7, V8]
  maps_to: {proposed: pericarpel_scales}
  states:
    smooth: naked; no scales, bumps or hairs
    scaly: covered in conspicuous scales (deltoid to rounded, often with pale or papery edges), overlapping or well spaced, with nothing in their axils
    woolly: scales or areoles with wool or long hairs in their axils
    spiny: scales or areoles bearing bristles or spines
  reliability: good on bud and flower close-ups
  notes: "Barrel cacti (Ferocactus) carry broad, conspicuous scales on the bud and pericarpel; many cacti have wool or spines there; most other flowers have a smooth tube or none. The fruit's surface is fruit.surface."

# --------------------------------------------------------- 7. inflorescence
- id: infl.type
  scale: inflorescence
  question: How are the flowers grouped?
  type: state
  views: [V7, V1, V4]
  maps_to: {trait: inflorescence}
  states:
    solitary: one flower on its own stalk
    raceme: stalked flowers along an unbranched axis
    spike: stalkless flowers along an unbranched axis
    catkin: a dense, often hanging spike of tiny flowers
    corymb: stalks of different lengths bringing flowers to one flat top
    umbel: stalks all from one point, like an umbrella
    compound_umbel: umbels on the rays of an umbel
    panicle: a branched cluster
    cyme: each axis ends in a flower, side branches flower later
    scorpioid: a coiled one-sided cyme uncurling as it flowers
    head: many stalkless flowers packed on one base (daisy, clover)
    spadix: a fleshy spike, usually with a hood (spathe)
  reliability: fair

- id: infl.posture
  scale: inflorescence
  question: Which way does the whole cluster point?
  type: state
  views: [V7, V1]
  maps_to: {trait: inflorescence_posture}
  states:
    erect: upright
    nodding: bent over at the top
    pendent: hanging
  reliability: good

- id: infl.position
  scale: inflorescence
  question: Where on the shoots do the flowers or clusters sit?
  type: state
  views: [V4, V1]
  maps_to: {trait: flowering_position}
  states:
    terminal: at the shoot tips
    lateral: along the shoots, in the leaf axils or on old wood
    both: both
  reliability: good

- id: infl.density
  scale: inflorescence
  question: How closely packed are the flowers along the cluster?
  type: ordinal
  views: [V7]
  maps_to: {proposed: inflorescence_density, related_trait: [units_per_inflorescence, inflorescence_length_m]}
  states:
    loose: clear stalk between neighbouring flowers
    medium: flowers touch here and there
    dense: flowers packed, hiding the axis
  reliability: good
  notes: The lupine raceme drawn sparse where the flora says dense is the case that raised this.

- id: infl.open_share
  scale: inflorescence
  question: Share of the cluster's flowers that are open (not bud, not fruit).
  type: share
  views: [V7]
  maps_to: {proposed: opening_order}
  reliability: fair
  notes: Depends on the date; the comparison uses it to match the render day.

- id: infl.length_over_height
  scale: inflorescence
  question: Length of one flower cluster divided by the plant's height (herbs) or by a leaf's length (trees and shrubs).
  type: ratio
  views: [V1, V4, V7]
  maps_to: {trait: inflorescence_length_m}
  reliability: fair

