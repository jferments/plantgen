# PlantGen's CI. It runs on its own two runner registrations, `plantgen-ci` and
# `plantgen-ci-2` (label `plantgen-ci`), inside Project After's CI machine
# (jferments/ci-infrastructure, docs/plantgen-runner.md): a third of the busy
# CPU against After's lanes, all of it when After is idle, and each runner its
# own Cargo target, so it never queues behind, slows or invalidates After's jobs.
# Drafts run nothing: CI starts when a PR is marked ready.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a run in progress: a build cancelled mid-compile can corrupt a
# shared Cargo target (After's light target, 2026-10-08).
concurrency:
  group: plantgen-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, plantgen-ci]
    timeout-minutes: 60
    env:
      # Per runner, so up to 40 GiB for both.
      CARGO_TARGET_BUDGET_GIB: "20"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      # Two commits deep, so a pull request's merge commit has its base as
      # HEAD^1 for the next step.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # A pull request that changes only files no Rust build or test reads
      # (imagekit, photo rules, docs, PlantLab, the top-level notes) skips
      # the Rust steps. Pushes to main and train runs (workflow_dispatch)
      # always run them.
      - name: What changed
        id: changes
        run: |
          set -eu
          rust=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            printf '%s\n' "$changed"
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" \
                | grep -qvE '^(imagekit/|photo-rules/|docs/|lab/|[^/]+\.md$)'; then
              rust=false
              echo "Only files outside the Rust workspace changed: skipping the Rust steps."
            fi
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
      # The Cargo target lives beside the checkout in this runner's own work
      # folder (_work/plantgen/cargo-target), which checkout never cleans and no
      # After runner uses; the service cannot create folders under ~/.cache.
      - name: Cargo target in this runner's work folder
        if: steps.changes.outputs.rust == 'true'
        run: echo "CARGO_TARGET_DIR=$RUNNER_WORKSPACE/cargo-target" >> "$GITHUB_ENV"
      - name: Start over when the Cargo target outgrows its budget
        if: steps.changes.outputs.rust == 'true'
        run: |
          set -eu
          if [ -d "$CARGO_TARGET_DIR" ]; then
            used=$(du -s --block-size=1G "$CARGO_TARGET_DIR" | cut -f1)
            echo "Cargo target: ${used} GiB of ${CARGO_TARGET_BUDGET_GIB}"
            if [ "$used" -gt "$CARGO_TARGET_BUDGET_GIB" ]; then
              rm -rf "$CARGO_TARGET_DIR"
            fi
          fi
      # The runner's service has no ~/.cargo/bin on its PATH (After's
      # rust_environment.py adds it the same way).
      - name: Toolchain (rust-toolchain.toml)
        if: steps.changes.outputs.rust == 'true'
        run: |
          set -eu
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          echo "$cargo_bin" >> "$GITHUB_PATH"
          export PATH="$cargo_bin:$PATH"
          rustup toolchain install 2>/dev/null || rustup show
          rustc --version
      - name: Format
        if: steps.changes.outputs.rust == 'true'
        run: cargo fmt --all --check
      - name: Clippy
        if: steps.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets --locked
      - name: Build
        if: steps.changes.outputs.rust == 'true'
        run: cargo build --workspace --all-targets --locked
      # --no-fail-fast runs every test binary after a failure, so one run
      # reports every failing test, not just the first binary's.
      - name: Test
        if: steps.changes.outputs.rust == 'true'
        run: cargo test --workspace --all-targets --locked --no-fail-fast
