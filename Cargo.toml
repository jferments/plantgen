[workspace]
resolver = "3"
members = ["crates/plantgen", "apps/plantc"]
# PlantLab is its own workspace, so this one never builds Bevy.
exclude = ["lab"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.plantgen]
opt-level = 3

[profile.test]
debug = "line-tables-only"
incremental = true

[profile.dev-full]
inherits = "dev"
debug = "full"
