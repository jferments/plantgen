[package]
name = "plantgen"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
libm = "=0.2.16"
png = "=0.18.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
# Optional, behind the `gpu` feature (Joshi, 2026-10-09): narrows space
# colonization's bud search on a GPU while the CPU decides, so the bytes
# are the same with or without it. The version is Bevy 0.19's, as After and
# PlantLab build it.
wgpu = { version = "=29.0.4", optional = true, default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "metal", "dx12"] }

[features]
gpu = ["dep:wgpu"]

# The build script merges the built-in species' inherited specs with the
# library's own code (`src/inherit.rs`, `src/formula.rs`).
[build-dependencies]
libm = "=0.2.16"
serde_json = "=1.0.145"

[lints]
workspace = true
